<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Autocode request and persistence flow</title>
  <desc id="desc">The browser sends a task to the FastAPI application service, which streams events from an agent runner and writes them to a journal and SQLite projection.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#e95420" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="298" rx="14" fill="#f8f8f8" stroke="#dedede"/>
  <text x="36" y="43" fill="#343a40" font-family="system-ui, sans-serif" font-size="20" font-weight="650">A task becomes a durable timeline</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="36" y="79" width="220" height="112" rx="10" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="146" y="121" fill="#343a40" font-size="18" font-weight="650">Browser interface</text>
    <text x="146" y="149" fill="#626970" font-size="14">Task and live events</text>
    <rect x="340" y="79" width="220" height="112" rx="10" fill="#ffffff" stroke="#e95420" stroke-width="2"/>
    <text x="450" y="121" fill="#343a40" font-size="18" font-weight="650">Application service</text>
    <text x="450" y="149" fill="#626970" font-size="14">REST and WebSocket</text>
    <rect x="644" y="79" width="220" height="112" rx="10" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="754" y="121" fill="#343a40" font-size="18" font-weight="650">Agent runner</text>
    <text x="754" y="149" fill="#626970" font-size="14">Deterministic or live</text>
    <rect x="340" y="222" width="220" height="54" rx="9" fill="#fff3ee" stroke="#e95420"/>
    <text x="450" y="255" fill="#343a40" font-size="15" font-weight="600">Journal + SQLite projection</text>
  </g>
  <g fill="none" stroke="#e95420" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M264 135 H326"/>
    <path d="M568 135 H630"/>
    <path d="M450 199 V210"/>
  </g>
</svg>
