schema_version: proof-lm/v1/config
name: standard
device: cuda
artifact_root: artifacts
output_namespace: prooflm/standard
model:
  vocab_size: 8192
  context_length: 512
  n_layers: 10
  d_model: 640
  n_heads: 10
  d_head: 64
  d_ff: 2560
  normalization: layer_norm
  position_encoding: rope
  activation: gelu
  dropout: 0.1
  tie_embeddings: true
  bias: false
training:
  objective: causal_language_modeling
  optimizer: adamw
  precision: bf16
  token_budget: 1000000000
  microbatch_size: 4
  gradient_accumulation: 32
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_updates: 2000
  max_updates: 1000000
  seed: 17
data:
  dataset_manifest_id: dataset-prooflm-v1
  tokenizer_id: tokenizer-prooflm-v1
  evaluator_id: evaluator-prooflm-v1
