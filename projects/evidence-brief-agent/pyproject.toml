[project]
name = "evidence-brief-agent"
version = "0.1.0"
description = "Deterministic evidence-brief workflow for the Watchtower LangGraph course"
readme = "README.md"
authors = [
    { name = "particle1331", email = "54845098+particle1331@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "pydantic>=2.13,<3",
]

[project.scripts]
evidence-brief = "evidence_brief.cli:main"

[project.optional-dependencies]
live = ["openai>=3.0.0,<4"]

[dependency-groups]
dev = ["pytest>=9.0.0", "ruff>=0.8.0", "pyright>=1.1.390.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "../.."
venv = ".venv"
reportTypedDictNotRequiredAccess = false

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evidence_brief"
