[project]
name = "watchtower-ai-assisted"
version = "0.1.0"
description = "The original Habit Tracker case study for the AI-assisted development course"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toy-project/habits"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Preserve the original journaled fixture, including its unused assigned habit.
"toy-project/tests/application/test_habit_service.py" = ["F841"]
