services:
  sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AUTOCODE_AGENT_MODE: demo
      AUTOCODE_DATA_DIR: /data
    volumes:
      - autocode-data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autocode
      POSTGRES_USER: autocode
      POSTGRES_PASSWORD: local-only
    profiles: ["postgres"]

volumes:
  autocode-data:
