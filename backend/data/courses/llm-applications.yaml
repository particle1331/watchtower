  - content: "Start with a query containing an exact product code and inspect why\
      \ simple substring lookup fails. Build token normalization, an inverted index,\
      \ document and term statistics, and BM25 ranking. Define relevant-document labels\
      \ independently of ranking code. Explain recall at k, reciprocal rank, and the\
      \ effect of candidate cutoffs without assuming a lexical retriever is always\
      \ weaker than embeddings.\n\nThe lesson below specifies an implementation and\
      \ experiment to build. Interfaces, stubs, package layouts and commands are proposed\
      \ lab artifacts; they do not indicate that executable code or measured results\
      \ already exist. Use a standalone fixture for each lab or combine selected components\
      \ in the optional course project.\n\n## Overview\n\nSparse lexical retrieval\
      \ is the baseline every fancier retrieval method is\nmeasured against, and it\
      \ is cheap enough that there's no excuse not to know it\ncold. This chapter\
      \ builds an inverted index and BM25 ranking with no retrieval\nlibraries, evaluated\
      \ on a small document set with known relevant answers.\nRecall@k and mean reciprocal\
      \ rank against the labeled set establish exactly how\nstrong this floor already\
      \ is. The result is the baseline every later retrieval\ntechnique in this arc\
      \ has to beat to justify its added complexity.\n\n## Prerequisites\n\n- **Tokenization\
      \ intuition** (Week 3, conceptually): you already know that turning\n  text\
      \ into discrete units is a lossy design choice. Here you build a *retrieval*\n\
      \  tokenizer — lowercase, split, optionally stem/stop — which is simpler than\
      \ BPE but\n  makes the same point: what you index determines what you can find.\n\
      - **Python fundamentals**: dictionaries, sets, `collections.Counter`/`defaultdict`,\n\
      \  and comfort writing a small class with clear method boundaries. No ML framework,\n\
      \  no PyTorch, no GPU.\n- **A little information theory / probability**, informally:\
      \ you should be\n  comfortable reading a log, a ratio, and the phrase \"how\
      \ surprising is this term.\"\n  The BM25 IDF term is derived below, so nothing\
      \ is assumed as a black box.\n- **No prior exposure needed** to inverted indexes,\
      \ TF-IDF, BM25, or IR evaluation\n  metrics — that is the point of this chapter,\
      \ and the arc.\n\n## What you're building\n\nA self-contained, dependency-light\
      \ lexical search engine plus an evaluation\nharness that scores it against a\
      \ labeled corpus. The whole thing is pure Python\nstandard library — the only\
      \ third-party packages you may reach for are `pytest`\n(tests) and, optionally,\
      \ `matplotlib` (to draw the parameter-sweep curve). **No\n`rank_bm25`, no `whoosh`,\
      \ no `sklearn`, no `elasticsearch`.** Reaching for those\ndefeats the week.\n\
      \nThree layers, built bottom-up:\n\n1. **Text → terms.** A deterministic analyzer\
      \ that normalizes and tokenizes text\n   the same way at index time and query\
      \ time.\n2. **Terms → index.** An inverted index mapping each term to the documents\
      \ that\n   contain it and the per-document frequency, plus the corpus statistics\
      \ BM25\n   needs (document lengths, average length, document frequency per term).\n\
      3. **Query → ranking.** A scorer that, given a query, produces the top-$k$\n\
      \   documents by BM25 score, and an evaluator that turns rankings into Recall@k\n\
      \   and MRR against relevance judgments.\n\n### Suggested file structure\n\n\
      ```\nweek13-bm25/\n├── README.md\n├── pyproject.toml            # or requirements.txt;\
      \ stdlib + pytest (+ matplotlib)\n├── .env.example              # only if you\
      \ add any config; no secrets this chapter\n├── data/\n│   ├── corpus.jsonl \
      \         # {\"doc_id\": \"...\", \"text\": \"...\"}\n│   ├── queries.jsonl\
      \         # {\"query_id\": \"...\", \"text\": \"...\"}\n│   └── qrels.tsv  \
      \           # query_id  doc_id  relevance(0/1)\n├── bm25/\n│   ├── __init__.py\n\
      │   ├── analyzer.py           # normalize + tokenize (index & query use the\
      \ SAME one)\n│   ├── index.py              # InvertedIndex: postings + corpus\
      \ statistics\n│   ├── scorer.py             # BM25 scoring over the index\n\
      │   └── evaluate.py           # Recall@k, MRR, parameter sweep\n├── scripts/\n\
      │   ├── build_index.py        # data/ -> in-memory (or pickled) index\n│   ├──\
      \ search.py             # CLI: query string -> ranked doc_ids\n│   └── run_eval.py\
      \           # produces the benchmark table + sweep\n└── tests/\n    ├── test_analyzer.py\n\
      \    ├── test_index.py\n    └── test_scorer.py\n```\n\n## The theory you need\n\
      \n### From term counts to TF-IDF\n\nLexical retrieval scores a document $d$\
      \ against a query $q$ by summing a\nper-term contribution over the query terms\
      \ $t \\in q$:\n\n$$\\text{score}(q, d) = \\sum_{t \\in q} w(t, d).$$\n\nThe\
      \ whole game is choosing $w$. Three intuitions constrain it:\n\n1. **Term frequency\
      \ (TF).** A document that mentions the query term more is more\n   likely about\
      \ it — but with *diminishing returns*. The 10th occurrence of\n   \"retrieval\"\
      \ tells you far less than the 1st.\n2. **Inverse document frequency (IDF).**\
      \ A term that appears in almost every\n   document (e.g. \"the\") is nearly\
      \ useless for discrimination; a rare term is\n   highly informative. Weight\
      \ terms by how *surprising* they are corpus-wide.\n3. **Length normalization.**\
      \ A long document accumulates term matches just by\n   being long. Without correction,\
      \ verbose documents win unfairly.\n\nClassic TF-IDF multiplies a (often log-dampened)\
      \ term frequency by an IDF factor.\nIt captures intuitions 1 and 2 but handles\
      \ saturation and length only crudely.\nBM25 is the principled fix.\n\n### BM25,\
      \ term by term\n\nFor a query $q$ and document $d$, BM25 scores:\n\n$$\\text{BM25}(q,\
      \ d) = \\sum_{t \\in q} \\text{IDF}(t)\\cdot\n\\frac{f(t, d)\\,(k_1 + 1)}{f(t,\
      \ d) + k_1\\left(1 - b + b\\,\\dfrac{|d|}{\\text{avgdl}}\\right)},$$\n\nwhere\n\
      \n- $f(t, d)$ is the raw frequency of term $t$ in document $d$;\n- $|d|$ is\
      \ the document length in tokens and $\\text{avgdl}$ the average document\n \
      \ length over the corpus;\n- $k_1 \\ge 0$ controls **term-frequency saturation**\
      \ — how quickly extra\n  occurrences stop helping (typical range $1.2\\text{–}2.0$);\
      \ as $k_1 \\to \\infty$\n  the term becomes linear in $f$, and at $k_1 = 0$\
      \ TF is ignored entirely;\n- $b \\in [0, 1]$ controls **length normalization**\
      \ — $b = 0$ disables it, $b = 1$\n  fully normalizes by relative length (typical\
      \ default $0.75$).\n\nThe IDF term is the Robertson–Sparck-Jones form:\n\n$$\\\
      text{IDF}(t) = \\ln\\!\\left(\\frac{N - n_t + 0.5}{n_t + 0.5} + 1\\right),$$\n\
      \nwhere $N$ is the number of documents and $n_t$ the number of documents\ncontaining\
      \ $t$. The $+1$ inside the log keeps the IDF non-negative even for very\ncommon\
      \ terms (the older form could go negative). Derive this once and you will\n\
      recognize it in every search system afterward.\n\nTwo properties worth internalizing\
      \ before you code:\n\n- The saturation term is a **rational function of $f$**\
      \ that asymptotes at\n  $\\text{IDF}(t)\\cdot(k_1 + 1)$. Sketch it for a couple\
      \ of $k_1$ values —\n  seeing the curve flatten explains why BM25 beats raw\
      \ TF-IDF on spammy text.\n- Length normalization only bites through the $b\\\
      ,|d|/\\text{avgdl}$ factor in the\n  denominator; a document exactly at average\
      \ length is unaffected regardless of\n  $b$. This is a good invariant to assert\
      \ in a test.\n\n### The inverted index\n\nYou never score every document against\
      \ every query term by scanning the corpus.\nThe **inverted index** maps each\
      \ term to a *postings list* — the documents that\ncontain it and the frequency\
      \ in each — so scoring a query touches only documents\nthat share at least one\
      \ term. Complexity for a query of $m$ terms is roughly\n\n$$O\\!\\left(\\sum_{t\
      \ \\in q} |\\text{postings}(t)|\\right)$$\n\nrather than $O(N \\cdot \\text{avgdl})$.\
      \ On a small corpus this is invisible; on a\nreal one it is the difference between\
      \ milliseconds and minutes, and it is *the*\nreason lexical search scales. Build\
      \ it now on a tiny corpus where you can inspect\nevery posting by hand.\n\n\
      ## Stub interfaces\n\nSignatures and shells only — the bodies are yours. Do\
      \ **not** fill these in from\nmemory of a library; derive them from the math\
      \ above.\n\n### `bm25/analyzer.py`\n\n```python\nfrom typing import Protocol\n\
      \nclass Analyzer(Protocol):\n    \"\"\"Text -> list of terms. MUST be used identically\
      \ at index and query time.\"\"\"\n    def __call__(self, text: str) -> list[str]:\
      \ ...\n\ndef simple_analyzer(\n    text: str,\n    *,\n    lowercase: bool =\
      \ True,\n    stopwords: frozenset[str] | None = None,\n    min_len: int = 1,\n\
      ) -> list[str]:\n    \"\"\"Normalize and tokenize.\n\n    Steps (TODO): casefold\
      \ if `lowercase`; split on non-alphanumeric; drop tokens\n    shorter than `min_len`;\
      \ drop `stopwords`. Keep it deterministic — the same\n    input must always\
      \ yield the same tokens, or index/query will silently diverge.\n    \"\"\"\n\
      \    ...\n```\n\n### `bm25/index.py`\n\n```python\nfrom dataclasses import dataclass,\
      \ field\n\n@dataclass\nclass InvertedIndex:\n    \"\"\"Postings + the corpus\
      \ statistics BM25 needs.\"\"\"\n    # term -> {doc_id: term_frequency_in_doc}\n\
      \    postings: dict[str, dict[str, int]] = field(default_factory=dict)\n   \
      \ doc_len: dict[str, int] = field(default_factory=dict)   # tokens per doc\n\
      \    n_docs: int = 0\n    avgdl: float = 0.0\n\n    def add(self, doc_id: str,\
      \ terms: list[str]) -> None:\n        \"\"\"Index one document. TODO: update\
      \ postings, doc_len; leave avgdl to finalize().\"\"\"\n        ...\n\n    def\
      \ finalize(self) -> None:\n        \"\"\"Compute derived stats once all docs\
      \ are added. TODO: set n_docs, avgdl.\"\"\"\n        ...\n\n    def doc_freq(self,\
      \ term: str) -> int:\n        \"\"\"n_t: number of documents containing `term`.\
      \ TODO.\"\"\"\n        ...\n\ndef build_index(corpus: dict[str, str], analyzer)\
      \ -> InvertedIndex:\n    \"\"\"corpus: doc_id -> raw text. TODO: analyze each\
      \ doc, add(), finalize().\"\"\"\n    ...\n```\n\n### `bm25/scorer.py`\n\n```python\n\
      import math\nfrom dataclasses import dataclass\n\n@dataclass\nclass BM25:\n\
      \    index: \"InvertedIndex\"\n    k1: float = 1.5\n    b: float = 0.75\n\n\
      \    def idf(self, term: str) -> float:\n        \"\"\"Robertson-Sparck-Jones\
      \ IDF with the +1 floor. TODO: implement the formula.\"\"\"\n        ...\n\n\
      \    def score(self, query_terms: list[str], doc_id: str) -> float:\n      \
      \  \"\"\"Sum the per-term BM25 contribution over query terms present in `doc_id`.\
      \ TODO.\"\"\"\n        ...\n\n    def search(self, query: str, analyzer, k:\
      \ int = 10) -> list[tuple[str, float]]:\n        \"\"\"Return the top-k (doc_id,\
      \ score), descending.\n\n        TODO: analyze the query; gather only candidate\
      \ docs from the postings of\n        the query terms (never scan the whole corpus);\
      \ score and sort. Define a\n        stable tie-break so equal scores are ordered\
      \ deterministically.\n        \"\"\"\n        ...\n```\n\n### `bm25/evaluate.py`\n\
      \n```python\ndef recall_at_k(ranked_ids: list[str], relevant_ids: set[str],\
      \ k: int) -> float:\n    \"\"\"|relevant ∩ top-k| / |relevant|. TODO. Decide\
      \ your convention if relevant is empty.\"\"\"\n    ...\n\ndef reciprocal_rank(ranked_ids:\
      \ list[str], relevant_ids: set[str]) -> float:\n    \"\"\"1 / rank of the first\
      \ relevant doc (1-indexed), else 0.0. TODO.\"\"\"\n    ...\n\ndef evaluate(\n\
      \    bm25: \"BM25\",\n    queries: dict[str, str],          # query_id -> text\n\
      \    qrels: dict[str, set[str]],       # query_id -> set of relevant doc_ids\n\
      \    analyzer,\n    k_values: tuple[int, ...] = (1, 5, 10),\n) -> dict:\n  \
      \  \"\"\"Run every query, aggregate mean Recall@k for each k and MRR. TODO.\"\
      \"\"\n    ...\n```"
    lab_and_evidence: "## How to build it (milestones)\n\n1. **Corpus first.** Write\
      \ `data/corpus.jsonl`, `queries.jsonl`, and `qrels.tsv`\n   by hand — 20–50\
      \ short documents (a few sentences each), 8–15 queries, and\n   binary relevance\
      \ judgments. Pick a domain you can judge yourself (recipes,\n   short bios,\
      \ FAQ snippets). Include *hard* cases on purpose: a query whose best\n   answer\
      \ shares few surface words, and a distractor document stuffed with a query\n\
      \   term but off-topic. These are what separate a real index from a toy.\n2.\
      \ **Analyzer + tests.** Lock the tokenizer down with `test_analyzer.py` before\n\
      \   anything depends on it. The one bug that will haunt you all week is an analyzer\n\
      \   that behaves differently at index vs. query time — assert they're the same\n\
      \   callable.\n3. **Index + tests.** Build `InvertedIndex`, verify postings\
      \ and `avgdl` on a\n   3-document toy corpus you can compute by hand.\n4. **Scorer\
      \ + tests.** Implement `idf`, `score`, `search`. Unit-test IDF and the\n   saturation\
      \ curve against values you compute manually; assert an average-length\n   document\
      \ is invariant to $b$.\n5. **Evaluate.** Wire `run_eval.py` to print the metrics\
      \ table and run the sweep.\n6. **Search CLI.** `scripts/search.py \"your query\
      \ here\"` prints ranked doc_ids and\n   scores — your fastest debugging loop\
      \ and a nice sanity check.\n\n## Checkable artifact — Benchmarks\n\nThe deliverable\
      \ that backs the abstract's claim (\"Recall@k and MRR establish\nexactly how\
      \ strong this floor already is\") is a small, reproducible benchmark\nreport\
      \ produced by `scripts/run_eval.py`.\n\n**Methodology.**\n\n- Run every query\
      \ through `BM25.search`, take the ranking, and compute Recall@k\n  for $k \\\
      in \\{1, 5, 10\\}$ and reciprocal rank against the qrels; report the mean\n\
      \  over queries (mean Recall@k and MRR).\n- **Parameter sweep (the ablation):**\
      \ hold the corpus fixed and sweep $k_1 \\in\n  \\{0.5, 1.0, 1.5, 2.0\\}$ and\
      \ $b \\in \\{0.0, 0.25, 0.5, 0.75, 1.0\\}$, reporting the\n  metric surface.\
      \ Include the two degenerate baselines explicitly: $k_1 = 0$\n  (TF ignored\
      \ — score reduces to IDF-only presence) and $b = 0$ (no length\n  normalization).\
      \ Seeing these lose is the point.\n\n**Expected shape of the result.** A table\
      \ plus one curve, roughly:\n\n| config | R@1 | R@5 | R@10 | MRR |\n| --- | ---\
      \ | --- | --- | --- |\n| $k_1{=}1.5,\\ b{=}0.75$ (default) | … | … | … | … |\n\
      | $k_1{=}0$ (IDF-only) | lower | … | … | lower |\n| $b{=}0$ (no length norm)\
      \ | … | … | … | … |\n| best swept config | … | … | … | … |\n\nYou should observe\
      \ that the tuned default clearly beats the IDF-only degenerate\ncase, that length\
      \ normalization ($b > 0$) helps once your corpus has a spread of\ndocument lengths,\
      \ and that the metrics plateau — the honest headline of the week\nis *how high\
      \ this cheap baseline already sits*, which every later retrieval week\nmust\
      \ climb above. Write a 3–5 sentence findings note interpreting your numbers\n\
      (not just dumping them); the interpretation is part of the artifact.\n\nReport\
      \ a fixed default config alongside the sweep so the number is reproducible,\n\
      and commit the exact `corpus.jsonl` / `qrels.tsv` used so the benchmark is\n\
      re-runnable.\n\n## How to run and test\n\n```bash\n# build the index and run\
      \ one query\npython scripts/build_index.py\npython scripts/search.py \"how do\
      \ I sear a steak\"\n\n# produce the benchmark table + parameter sweep\npython\
      \ scripts/run_eval.py\n\n# tests\npytest -q\n```\n\nAim for tests that pin the\
      \ math, not just the plumbing: a hand-computed BM25\nscore for a 3-document\
      \ corpus, an IDF value you worked out with a calculator, the\naverage-length\
      \ invariance under $b$, and a Recall@k / RR case with a known ranking.\nIf those\
      \ pass, your sweep numbers are trustworthy.\n\n## Stretch goals (optional)\n\
      \n- Add a **stemmer** (a small Porter-style or even a crude suffix-stripper)\
      \ and\n  measure whether it moves Recall@k — sometimes it helps, sometimes it\
      \ merges\n  distinct terms and hurts. Let the benchmark decide.\n- Implement\
      \ **BM25+** or **BM25L** (lower-bounded variants that fix BM25's\n  under-scoring\
      \ of very long documents) and compare on the same qrels.\n- Persist the index\
      \ (pickle or a tiny JSON) and time build-vs-load, foreshadowing\n  why real\
      \ systems separate indexing from serving.\n\n## Hardware, cost & subscriptions\n\
      \n- **Hardware:** any laptop, CPU-only. The corpus is tens of documents; nothing\n\
      \  here is memory- or compute-bound.\n- **Cost:** \\$0. No hosted LLM API, no\
      \ GPU, no Docker required this chapter —\n  consistent with the course README's\
      \ \"most weeks cost \\$0, local CPU only.\"\n- **Subscriptions / keys:** none.\
      \ There are no secrets to manage this chapter; if you\n  later add any configuration,\
      \ commit a `.env.example` rather than a real `.env`\n  and keep the real file\
      \ git-ignored — the standard habit the rest of the course\n  relies on.\n- **Dependencies:**\
      \ Python standard library only for the engine; `pytest` for\n  tests and optionally\
      \ `matplotlib` for the sweep plot. No retrieval or ML\n  libraries.\n\n### Report\
      \ the actual execution path\n\nRetain the pinned environment, fixture and configuration\
      \ identities, case-level outcomes, reproduction command and one observed limitation.\
      \ Distinguish offline mechanism checks from actual model, database, inference-server\
      \ or cloud measurements. Cost figures and tool choices in these source-derived\
      \ lab specifications are planning assumptions; verify maintained APIs, record\
      \ actual usage and set a bounded budget when implementing the experiment. Keep\
      \ optional work separate from the baseline report."
    summary: Implement an inverted index and BM25 as a measured retrieval baseline.
    chapter_id: course/llm-applications/04-lexical-search
    section: retrieval
  - content: "Embed the same documents and queries with a pinned small model, or use\
      \ deterministic fixture vectors for offline checks. Implement exact cosine search\
      \ before studying a small HNSW or IVF mechanism. Use a maintained index for\
      \ the realistic path and separate algorithm understanding from production implementation.\
      \ Explain embedding normalization, dimensions, distance choice, and the loss\
      \ of neighbors caused by approximation.\n\nThe lesson below specifies an implementation\
      \ and experiment to build. Interfaces, stubs, package layouts and commands are\
      \ proposed lab artifacts; they do not indicate that executable code or measured\
      \ results already exist. Use a standalone fixture for each lab or combine selected\
      \ components in the optional course project.\n\n## Overview\n\nEvery vector\
      \ database runs an approximate nearest-neighbor algorithm under the\nhood, and\
      \ building one removes the mystery from all of them. This chapter you\nimplement\
      \ HNSW (or IVF) by hand over a dense embedding index and compare recall\nand\
      \ latency against brute-force cosine search across a sweep of index-size and\n\
      search-parameter settings (`ef` or `nprobe`). The resulting recall-versus-latency\n\
      curves make the approximate-nearest-neighbor tradeoff explicit at every setting\
      \ in\nthe sweep, and compressing the vectors themselves — int8/binary quantization\
      \ and\nMatryoshka truncation to a shorter prefix — adds a second recall-versus-memory\n\
      axis measured on the same index. This is the same tradeoff every vector database\n\
      product page is quietly making a default choice about on your behalf.\n\n##\
      \ Prerequisites\n\n- **Embeddings as vectors.** You should be comfortable that\
      \ a text (or image)\n  embedding is a fixed-length dense vector, and that semantic\
      \ similarity is\n  measured by an inner product or cosine — i.e. nearby vectors\
      \ mean similar\n  meaning. You do not need to have trained an embedding model.\n\
      - **Retrieval evaluation.** The `recall@k` and MRR notions from the sparse-retrieval\n\
      \  week of this arc carry over directly. Here, though, \"relevant\" is defined\
      \ by the\n  exact brute-force top-k rather than a human label — you are measuring\
      \ how well the\n  approximation reproduces the *exact* answer, not how good\
      \ the embeddings are.\n- **Complexity intuition.** You should be able to reason\
      \ informally about\n  $O(n)$ vs. sublinear search and why a linear scan over\
      \ millions of vectors is the\n  thing we are trying to avoid.\n- **Python numerics.**\
      \ Comfort with NumPy vectorized operations (broadcasting,\n  `argsort`, `argpartition`,\
      \ dtype control) is assumed; the whole week lives in\n  NumPy with no ANN library.\n\
      \n## What you are building\n\nA small, self-contained ANN library plus a benchmark\
      \ harness. Concretely:\n\n1. A **brute-force exact index** — the ground-truth\
      \ oracle every measurement is\n   scored against.\n2. **One ANN index** — choose\
      \ either **HNSW** (a navigable small-world graph) or\n   **IVF** (inverted file\
      \ / coarse quantization). Pick one and do it well; the\n   \"or\" in the title\
      \ is a real choice, not a request for both.\n3. A **vector compression layer**\
      \ — int8 scalar quantization, 1-bit binary\n   quantization, and Matryoshka\
      \ prefix truncation — that plugs underneath the index\n   so you can measure\
      \ a second, memory-oriented tradeoff on the *same* index.\n4. A **benchmark\
      \ harness** that sweeps parameters and emits the recall/latency/memory\n   tables\
      \ and plots that constitute this chapter's checkable artifact.\n\nYou do **not**\
      \ need to train embeddings. Embed a small corpus once with any free\nlocal model\
      \ (e.g. a `sentence-transformers` MiniLM, ~384-dim) or even a cached\n`.npy`\
      \ of precomputed vectors, and treat that matrix as your fixed dataset.\n\n###\
      \ File structure\n\n```\nweek14-ann-search/\n├── README.md\n├── pyproject.toml\n\
      ├── .env.example              # only if you fetch embeddings from an API; prefer\
      \ local\n├── src/\n│   └── annsearch/\n│       ├── __init__.py\n│       ├──\
      \ dataset.py        # load/embed corpus -> (N, d) float32 matrix + queries\n\
      │       ├── distance.py       # cosine / L2 / dot; normalization helpers\n│\
      \       ├── exact.py          # brute-force oracle (ground-truth top-k)\n│ \
      \      ├── hnsw.py           # OR ivf.py — the one ANN index you chose\n│  \
      \     ├── quantize.py       # int8 / binary / Matryoshka codecs\n│       ├──\
      \ metrics.py        # recall@k, MRR, latency timing, memory accounting\n│  \
      \     └── protocols.py      # the shared VectorIndex interface\n├── scripts/\n\
      │   ├── build_dataset.py      # embed once, cache to data/*.npy\n│   └── run_benchmark.py\
      \      # sweep params -> results/*.csv + plots\n├── tests/\n│   ├── test_exact.py\n\
      │   ├── test_index_recall.py  # ANN recall must clear a floor at high ef/nprobe\n\
      │   └── test_quantize.py      # round-trip + monotonic recall/memory checks\n\
      ├── data/                     # gitignored embeddings cache\n└── results/  \
      \                # gitignored CSVs + figures\n```\n\nKeep `data/` and `results/`\
      \ out of git; commit the code and this README, not the\nartifacts.\n\n## Core\
      \ concepts\n\n### The problem, stated precisely\n\nGiven a dataset of $N$ vectors\
      \ $\\{x_i\\}_{i=1}^N \\subset \\mathbb{R}^d$ and a query\n$q \\in \\mathbb{R}^d$,\
      \ exact k-NN returns\n\n$$\\text{top-}k(q) = \\text*{arg\\,min}_{S:\\,|S|=k}\
      \ \\sum_{i \\in S} \\text{dist}(q, x_i).$$\n\nFor cosine similarity, if you\
      \ **L2-normalize every vector once** at load time, then\n\n$$\\cos(q, x) = \\\
      frac{q \\cdot x}{\\lVert q\\rVert\\,\\lVert x\\rVert} = \\hat q \\cdot \\hat\
      \ x,$$\n\nso cosine ranking reduces to a plain dot product and \"nearest\" (largest\
      \ cosine) and\n\"smallest L2 distance\" agree. Normalizing up front is the single\
      \ most useful\nsimplification this chapter — do it in `dataset.py` and let the\
      \ rest of the code assume\nunit vectors.\n\nBrute force computes all $N$ dot\
      \ products in $O(Nd)$ per query. ANN buys sublinear\n*expected* query time by\
      \ only ever looking at a small, cleverly chosen subset of the\n$N$ vectors —\
      \ at the cost of sometimes missing a true neighbor. **Recall is the\nprice you\
      \ pay for speed**, and quantifying that exchange rate is the entire point.\n\
      \n### Recall, defined against the oracle\n\nLet $A_k(q)$ be the set the ANN\
      \ index returns and $G_k(q)$ the exact top-k from the\noracle. Recall@k for\
      \ a query is\n\n$$\\text{recall@}k(q) = \\frac{|A_k(q) \\cap G_k(q)|}{k},$$\n\
      \naveraged over the query set. Note this is *approximation* recall, not\nretrieval-quality\
      \ recall: a perfect ANN index scores 1.0 even if the embeddings are\nbad, because\
      \ the oracle is computed from the same embeddings.\n\n### Path A — HNSW (a navigable\
      \ small-world graph)\n\nHNSW builds a multi-layer proximity graph. Each node\
      \ exists on layer 0 and,\nprobabilistically, on some number of higher layers;\
      \ higher layers are sparse and act\nas an express skip-list over the space.\
      \ Search enters at the top layer's entry\npoint, greedily hops toward the query,\
      \ then descends a layer and repeats, doing a\nbest-first beam search on layer\
      \ 0.\n\nKey ideas to internalize:\n\n- **Layer assignment.** A node's maximum\
      \ layer is drawn as\n  $\\ell = \\lfloor -\\ln(U)\\cdot m_L \\rfloor$ with $U\
      \ \\sim \\text{Uniform}(0,1)$ and\n  $m_L = 1/\\ln M$. This geometric decay\
      \ makes the expected graph height $O(\\log N)$.\n- **Neighbor selection.** On\
      \ insertion you connect a new node to up to $M$ neighbors\n  per layer, chosen\
      \ from a candidate pool of size `ef_construction` using a\n  heuristic that\
      \ keeps the graph *navigable* (diverse directions) rather than merely\n  keeping\
      \ the $M$ closest — the diversity heuristic is what prevents clustered dead\n\
      \  ends.\n- **Search.** A single knob, `ef` (search beam width), trades recall\
      \ for latency:\n  larger `ef` explores more of the graph. Expected search cost\
      \ is roughly\n  $O(\\text{ef}\\cdot \\log N \\cdot d)$.\n\n### Path B — IVF\
      \ (inverted file / coarse quantization)\n\nIVF partitions the space into `nlist`\
      \ Voronoi cells by running k-means over a sample\nof the data; each cell has\
      \ a centroid and an inverted list of the vectors assigned\nto it. At query time\
      \ you find the `nprobe` closest centroids and scan only those\ncells' lists.\n\
      \nKey ideas to internalize:\n\n- **Training.** k-means over (a sample of) the\
      \ dataset yields `nlist` centroids;\n  assignment is one $\\arg\\min$ over centroids\
      \ per vector.\n- **The single knob.** `nprobe` (how many cells to scan) trades\
      \ recall for latency,\n  exactly analogous to HNSW's `ef`. With `nprobe = nlist`\
      \ you degrade to brute force.\n- **Cost.** Query cost is roughly $O(\\text{nlist}\\\
      cdot d)$ to rank centroids plus\n  $O(\\tfrac{\\text{nprobe}}{\\text{nlist}}\
      \ N d)$ to scan the probed lists — the second\n  term is the payoff: you touch\
      \ a `nprobe/nlist` fraction of the data.\n\nA common heuristic is $\\text{nlist}\
      \ \\approx \\sqrt{N}$; treat that as a starting\npoint in your sweep, not a\
      \ law.\n\n### Vector compression (the second axis)\n\nIndependent of *which*\
      \ vectors you visit, you can shrink *how big each vector is*:\n\n- **int8 scalar\
      \ quantization.** Map each float32 component into 256 buckets via a\n  per-dimension\
      \ (or global) scale and zero-point:\n  $q = \\text{round}(x/s) + z$. Storage\
      \ drops 4× (32→8 bits). Distances are\n  computed in int8/int32 with a scale\
      \ correction. Expect a small recall dip.\n- **Binary (1-bit) quantization.**\
      \ Keep only the sign of each component;\n  similarity becomes Hamming distance\
      \ (a `popcount` on XORed bit-vectors),\n  ~32× smaller and extremely fast, with\
      \ a larger recall dip — often used as a fast\n  *first-stage* filter before\
      \ an exact re-rank.\n- **Matryoshka truncation.** If the embedding model is\
      \ Matryoshka-trained (or you\n  just accept the degradation), keep only the\
      \ first $d' < d$ dimensions. Storage and\n  compute scale as $d'/d$. Recall\
      \ degrades gracefully with $d'$.\n\nEach codec is a pair of functions — encode\
      \ the dataset, and score a query against\nthe encoded store — so it can slot\
      \ under the exact index *and* the ANN index without\nchanging either.\n\n##\
      \ Stub interfaces\n\nA single protocol lets the harness treat every index the\
      \ same way.\n\n```python\n# src/annsearch/protocols.py\nfrom typing import Protocol,\
      \ runtime_checkable\nimport numpy as np\n\n@runtime_checkable\nclass VectorIndex(Protocol):\n\
      \    \"\"\"Any index the benchmark can score: build once, query many.\"\"\"\n\
      \n    def build(self, vectors: np.ndarray) -> None:\n        \"\"\"Index an\
      \ (N, d) float32 matrix of *unit-normalized* vectors.\"\"\"\n        ...  #\
      \ TODO\n\n    def query(self, q: np.ndarray, k: int) -> np.ndarray:\n      \
      \  \"\"\"Return indices of the approximate top-k for a single (d,) query.\"\"\
      \"\n        ...\n\n    @property\n    def memory_bytes(self) -> int:\n     \
      \   \"\"\"Bytes held by the index payload (vectors + structure).\"\"\"\n   \
      \     ...\n```\n\n```python\n# src/annsearch/exact.py\nimport numpy as np\n\n\
      class ExactIndex:\n    \"\"\"Brute-force cosine/dot oracle. This defines ground\
      \ truth.\"\"\"\n\n    def build(self, vectors: np.ndarray) -> None:\n      \
      \  # TODO: store the (N, d) matrix; assume it is already unit-normalized\n \
      \       ...\n\n    def query(self, q: np.ndarray, k: int) -> np.ndarray:\n \
      \       # TODO: scores = self._X @ q ; return argpartition top-k, then sort\n\
      \        ...\n```\n\n```python\n# src/annsearch/hnsw.py   (choose ONE of hnsw.py\
      \ / ivf.py)\nfrom dataclasses import dataclass, field\nimport numpy as np\n\n\
      @dataclass\nclass HNSW:\n    M: int = 16                 # neighbors per node\
      \ per layer\n    ef_construction: int = 200  # candidate pool width at build\
      \ time\n    ef: int = 64                # search beam width (the recall/latency\
      \ knob)\n    # internal state\n    _layers: list = field(default_factory=list)\
      \   # adjacency per layer\n    _entry: int | None = None\n\n    def _assign_layer(self,\
      \ rng: np.random.Generator) -> int:\n        # TODO: floor(-ln(U) / ln(M));\
      \ geometric decay -> O(log N) height\n        ...\n\n    def _search_layer(self,\
      \ q, entry_points, ef, layer) -> list[int]:\n        # TODO: best-first beam\
      \ search; maintain a visited set + candidate heap\n        ...\n\n    def _select_neighbors(self,\
      \ cand, M) -> list[int]:\n        # TODO: diversity heuristic, not just the\
      \ M nearest\n        ...\n\n    def build(self, vectors: np.ndarray) -> None:\n\
      \        # TODO: insert nodes one by one, wiring layers top-down\n        ...\n\
      \n    def query(self, q: np.ndarray, k: int) -> np.ndarray:\n        # TODO:\
      \ descend layers greedily, then beam-search layer 0 with self.ef\n        ...\n\
      \n    @property\n    def memory_bytes(self) -> int:\n        ...\n```\n\n```python\n\
      # src/annsearch/ivf.py   (the alternative to hnsw.py)\nfrom dataclasses import\
      \ dataclass\nimport numpy as np\n\n@dataclass\nclass IVF:\n    nlist: int =\
      \ 256    # number of Voronoi cells (~ sqrt(N) to start)\n    nprobe: int = 8\
      \     # cells scanned at query time (the recall/latency knob)\n\n    def _kmeans(self,\
      \ sample: np.ndarray) -> np.ndarray:\n        # TODO: Lloyd's algorithm -> (nlist,\
      \ d) centroids\n        ...\n\n    def build(self, vectors: np.ndarray) -> None:\n\
      \        # TODO: train centroids, assign every vector to its nearest cell,\n\
      \        #       build inverted lists {cell_id -> [row indices]}\n        ...\n\
      \n    def query(self, q: np.ndarray, k: int) -> np.ndarray:\n        # TODO:\
      \ rank centroids, scan the top-`nprobe` lists, merge top-k\n        ...\n\n\
      \    @property\n    def memory_bytes(self) -> int:\n        ...\n```\n\n```python\n\
      # src/annsearch/quantize.py\nfrom typing import Protocol\nimport numpy as np\n\
      \nclass Codec(Protocol):\n    def encode(self, vectors: np.ndarray): ...\n \
      \   def score(self, encoded, q: np.ndarray) -> np.ndarray:\n        \"\"\"Similarity\
      \ of the encoded store to a (raw or encoded) query.\"\"\"\n        ...\n   \
      \ @property\n    def bytes_per_vector(self) -> int: ...\n\nclass Int8Codec:\n\
      \    # TODO: per-dim scale + zero-point; store int8; score with scale correction\n\
      \    ...\n\nclass BinaryCodec:\n    # TODO: sign bits packed with np.packbits;\
      \ score via popcount(XOR)\n    ...\n\nclass MatryoshkaCodec:\n    def __init__(self,\
      \ dims: int): self.dims = dims\n    # TODO: keep first `dims` components, renormalize,\
      \ score as dot product\n    ...\n```\n\n```python\n# src/annsearch/metrics.py\n\
      import numpy as np\n\ndef recall_at_k(approx: np.ndarray, exact: np.ndarray,\
      \ k: int) -> float:\n    \"\"\"Mean over queries of |approx_k ∩ exact_k| / k.\"\
      \"\"  # TODO\n    ...\n\ndef time_queries(index, queries: np.ndarray, k: int)\
      \ -> dict:\n    \"\"\"Return latency stats (p50/p95 ms/query) over the query\
      \ set.\"\"\"  # TODO\n    ...\n```"
    lab_and_evidence: "## How to build it (milestones)\n\n1. **Dataset + oracle.**\
      \ Embed (or load) a small corpus — start at $N \\approx 10\\text{k}$,\n   $d\
      \ \\approx 384$ — normalize, cache to `data/*.npy`, and implement `ExactIndex`.\n\
      \   Sanity check: `ExactIndex` on the query set is your ground truth; a query\
      \ for a\n   dataset vector returns itself at rank 0.\n2. **The ANN index.**\
      \ Implement HNSW *or* IVF against `VectorIndex`. First get it\n   *correct*\
      \ (recall ≈ 1.0 at a large `ef`/`nprobe`), then get it *fast*. A useful\n  \
      \ invariant: as the knob → its max, ANN recall → the exact oracle.\n3. **The\
      \ sweep harness.** In `run_benchmark.py`, loop over the knob and over $N$,\n\
      \   record recall@k and per-query latency, and write tidy long-format CSV to\n\
      \   `results/`.\n4. **Compression layer.** Add the three codecs and rerun the\
      \ recall/latency sweep at\n   a fixed good knob setting, now varying the codec,\
      \ to trace the recall-vs-memory\n   axis.\n5. **Plots + write-up.** Produce\
      \ the two figures below and a short paragraph reading\n   off where each curve's\
      \ knee sits.\n\nScope guard: one ANN algorithm, three codecs, one small dataset.\
      \ Resist adding PQ,\nOPQ, GPU kernels, or a second graph type — those are stretch\
      \ goals, not the week.\n\n## Checkable artifact — Benchmarks\n\nThe deliverable\
      \ that demonstrates the abstract's claims is a benchmark report with\ntwo axes,\
      \ all scored against the brute-force oracle on the same embeddings.\n\n**Axis\
      \ 1 — recall vs. latency (the ANN tradeoff).**\n\n- Sweep the single search\
      \ knob (`ef` for HNSW, `nprobe` for IVF) across ~6–8 values\n  from \"cheap/low-recall\"\
      \ to \"expensive/near-exact.\"\n- Repeat for ~3 dataset sizes $N$ (e.g. 1k /\
      \ 10k / 50k) to show how the curve shifts\n  as the index grows.\n- **Expected\
      \ shape:** a monotone-increasing, concave recall-vs-latency curve with a\n \
      \ clear knee — recall climbs steeply then saturates near 1.0 while latency keeps\n\
      \  rising. ANN should reach, say, ≥0.95 recall@10 at a small fraction of brute-force\n\
      \  latency; brute force is the single point at recall = 1.0 and the highest\
      \ latency,\n  and every ANN point should sit above/left of it (Pareto-better)\
      \ until the knob is\n  maxed.\n\n**Axis 2 — recall vs. memory (the compression\
      \ tradeoff).**\n\n- Fix the search knob at a good operating point and vary the\
      \ codec:\n  float32 → int8 → Matryoshka(d′) → binary.\n- Report bytes/vector\
      \ and recall@10 for each.\n- **Expected shape:** a descending staircase — int8\
      \ costs ~4× less memory for a\n  small recall drop; Matryoshka trades recall\
      \ smoothly as $d'$ shrinks; binary is\n  ~32× smaller with the largest drop\
      \ (and is the natural candidate for a\n  filter-then-rerank two-stage scheme,\
      \ worth noting even if you don't build it).\n\n**Report contents (`results/`):**\n\
      \n- `sweep.csv` — long-format rows of `(index, N, knob_name, knob_value, codec,\
      \ recall@10, p50_ms, p95_ms, memory_bytes)`.\n- `recall_vs_latency.png` — one\
      \ line per $N$.\n- `recall_vs_memory.png` — one bar/point per codec.\n- 1–2\
      \ paragraphs stating where each knee is and what default you'd ship.\n\nA reader\
      \ can verify your week by re-running `run_benchmark.py` and checking that the\n\
      CSV reproduces the two curves with the qualitative shapes above.\n\n## How to\
      \ run and test it\n\n- **Run the pipeline:**\n\n  ```bash\n  uv run python scripts/build_dataset.py\
      \      # embed once -> data/*.npy\n  uv run python scripts/run_benchmark.py\
      \      # sweep -> results/*.csv + *.png\n  ```\n\n- **Tests (`pytest`), each\
      \ a cheap correctness gate:**\n  - `test_exact.py` — a dataset vector queried\
      \ against the index returns itself first.\n  - `test_index_recall.py` — at the\
      \ max knob, ANN recall@10 ≥ 0.99 vs. the oracle on\n    a tiny fixed dataset\
      \ (correctness before speed).\n  - `test_quantize.py` — each codec round-trips\
      \ within tolerance, reported\n    `bytes_per_vector` matches the dtype, and\
      \ recall is monotone in the compression\n    level on a fixed seed.\n\n- **Determinism:**\
      \ seed every RNG (layer assignment, k-means init, dataset sampling)\n  so the\
      \ sweep and tests are reproducible; record the seed in the CSV.\n\n## Security\
      \ & hygiene\n\n- If you pull embeddings from a hosted API instead of a local\
      \ model, keep the key in\n  `.env` (loaded at runtime) and commit only `.env.example`\
      \ — never the real key.\n  Prefer the local model so the week is genuinely $0\
      \ and offline.\n- The corpus you embed is untrusted text, not code — you never\
      \ execute it, so there's\n  no sandboxing concern this chapter; just don't `eval`/`pickle`-load\
      \ anything you\n  didn't produce. Load caches with `np.load(..., allow_pickle=False)`.\n\
      - Gitignore `data/` and `results/` so large binaries and any embedded corpus\
      \ don't\n  land in version control.\n\n## Hardware, cost & subscriptions\n\n\
      - **Hardware:** CPU-only. Everything — embedding a small corpus, building the\
      \ index,\n  and the entire sweep — runs comfortably on a laptop. Keep $N \\\
      le 50\\text{k}$ and\n  $d \\approx 384$ so a full sweep finishes in minutes;\
      \ no GPU is needed.\n- **Cost:** \\$0 with a small local/free embedding model\
      \ (e.g. a MiniLM via\n  `sentence-transformers`) or precomputed `.npy` vectors.\
      \ No rented GPU hours.\n- **Subscriptions:** none required. No hosted LLM API\
      \ and no Docker are needed. A\n  hosted embedding API is optional only if you'd\
      \ rather not run a local model — in\n  which case a few cents covers embedding\
      \ the corpus once, and the `.env` hygiene\n  above applies.\n\n### Report the\
      \ actual execution path\n\nRetain the pinned environment, fixture and configuration\
      \ identities, case-level outcomes, reproduction command and one observed limitation.\
      \ Distinguish offline mechanism checks from actual model, database, inference-server\
      \ or cloud measurements. Cost figures and tool choices in these source-derived\
      \ lab specifications are planning assumptions; verify maintained APIs, record\
      \ actual usage and set a bounded budget when implementing the experiment. Keep\
      \ optional work separate from the baseline report."
