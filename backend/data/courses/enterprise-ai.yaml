    section: decisions
  outcome: Enforce the current user's permissions on every resource and tool request;
    exclude forbidden evidence from retrieval and generation; measure access revocation
    and synchronization behavior; minimize sensitive data and preserve useful audit
    records; verify deletion across dependent stores; test injection and supply-chain
    failures; attribute usage and cost; compare vendors against measured requirements;
    explain a design to a reviewer.
  description: 'Teach the application and decision-making controls needed when an
    AI service handles organizational documents and actions: resource authorization,
    permission-aware retrieval, synchronization and revocation, sensitive-data handling,
    audit records, deletion, adversarial testing, cost attribution, and vendor evaluation.
    Express each control as ordinary code, an observable test, or a reviewable decision
    document. Technical exercises do not certify legal compliance or complete security.


    ### The running project


    An internal support/document assistant for two fictional organizations with different
    users and roles. Independent fixtures cover tickets, document permissions, revisioned
    search indexes, logs, caches, and simulated tools. A cumulative optional implementation
    can extend the application course''s assistant. Use synthetic canaries to detect
    forbidden data and simulated actions to inspect authorization without contacting
    real users or systems.


    ### Practice and assessment


    Produce permission matrices, allowed/denied traces, synchronization and deletion
    reports, labeled benign/adversarial cases, cost reports, and a decision memo.
    Measure both harmful actions allowed and legitimate tasks blocked. Freeze test
    cases before comparing defenses and report surviving attacks and untested conditions.
    Audit records describe actual input identities, evidence IDs, tool outcomes, and
    versions; generated explanations are not proof of a model''s internal causal reasoning.'
  prerequisites: Python programmers familiar with tool calling, retrieval-augmented
    generation, a web API, relational data, and identity versus authorization. Build
    LLM Applications and the first four chapters of Deploy and Operate AI Systems
    provide this background. Core labs use two fictional organizations, supplied identities,
    local fixtures, and synthetic data. Real workplace connectors, production identity
    providers, and private cloud networking are optional extensions with recorded
    versions and bounded costs.
  references: 'Adapted from 100-weeks-of-ai Enterprise AI guides 1–5, 7–9 and elective
    10; Foundations 21, 35; AI Applications 11, 21; Systems and Security 6–8. OWASP
    excessive-agency guidance: https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
    . Google Cloud application operations guidance: https://docs.cloud.google.com/architecture/deploy-operate-generative-ai-applications
    . Verify maintained identity, database, storage, and networking documentation
    during executable chapter authoring.'
