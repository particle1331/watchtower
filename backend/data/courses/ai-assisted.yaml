overview: course/ai-assisted/00-watchtower2-overview
home:
  outcome: 'Build and explain an isolated Watchtower2 prototype: a headless `wt2`
    CLI and declarative Flet CMS over shared Python application services, Turso records,
    Backblaze B2 files, and backend-owned deletion and garbage collection. Trace a
    save, explain a conflict, recover interrupted work, and follow authored content
    through frontend generation to a deliberate website release.


    Each stage produces a small implementation, observable evidence and an explanation
    you can review. The intended result is an application whose behavior you can maintain
    and challenge. The current course is a draft: the overview is written and the
    remaining chapters are planned; the proposed system has not been implemented.'
  description: 'AI coding agents can add code faster than its owner develops a mental
    model of it. This course uses a real content-management system to practice keeping
    architectural decisions, implementation scope and evidence understandable as the
    application grows. The running project is `projects/watchtower2/`, an independent
    prototype informed by read-only study of the working Watchtower CMS.


    ## How the course develops


    Begin by tracing the existing system and explaining its storage growth. Define
    sources of truth and invariants, prove the provider assumptions, then build one
    complete Kanban slice through the CLI and an early Flet screen. Extend those boundaries
    to shared uploads, garbage collection, recovery, notebooks, course organization
    and the other authoring workflows. Finish with disposable frontend generation,
    frozen releases and an audit that deliberately challenges the checks.


    At each stage, inspect the relevant code, predict the stored changes, write a
    small plan, review the diff and demonstrate a failure case. The human owns consequential
    design choices. AI assistance supports the work; learner explanations and observed
    results establish what is understood.


    This is an evolving build course, not a report of a completed implementation.
    Work uses isolated databases, object namespaces, source copies and publishing
    targets. The working CMS remains independent. Whether to adopt the prototype is
    a separate future decision.


    ## Flet background


    The companion **Introduction to Flet** post series covers declarative UI and layout,
    components and state, forms and dialogs, async work and services, navigation and
    lists, and files and rich content. Read the relevant post when a chapter needs
    it. Watchtower2 chapters apply those concepts to its shared backend, editor buffers
    and revisions, upload operations and job feedback. The six posts are currently
    Planned; their articles will become available as they are authored.'
  requirements:
  - A computer with a terminal, Git, an editor or Jupyter, and uv; use the Python
    version pinned by the Watchtower2 project. No GPU is required.
  - An AI coding assistant for the assisted implementation exercises. Availability,
    usage limits and cost depend on the chosen tool; no particular vendor or multi-agent
    setup is required.
  - Disposable Turso and Backblaze B2 resources with separately scoped credentials
    for the remote chapters, plus a separate GitHub publishing target for the deployment
    exercise. Local fixtures support earlier stages but do not establish remote-provider
    behavior. Confirm current service limits and costs before provisioning.
  - Quarto for the frontend/rendering chapters. Keep provider credentials out of notebooks
    and Git; local experiments use the OS keyring and isolated configuration.
  prerequisites:
  - Comfort with Python functions, classes, modules, exceptions and basic automated
    tests.
  - Basic Git branches, commits and diffs, and the ability to navigate an unfamiliar
    Python repository.
  - A basic understanding of SQL tables and keys and HTTP requests is helpful. The
    course introduces the transaction, object-storage and recovery concepts used by
    the application; no machine-learning background is assumed.
