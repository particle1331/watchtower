id: course/llms-from-scratch
purpose: Build and evaluate a small decoder-only GPT in PyTorch, following the core progression of Sebastian Raschka's LLMs-from-scratch repository.
audience: Python programmers who know basic neural-network training and want to understand the data, attention, training, and fine-tuning pipeline by implementing it.
planned:
  summary: >-
    Start with the language-model task and an experiment contract, then prepare token
    sequences, derive causal multi-head attention, assemble GPT, and pretrain it.
    Branch into classification and instruction fine-tuning, study LoRA as an
    optional extension, and finish with a reproducible comparison of the stages.
  source: https://github.com/rasbt/LLMs-from-scratch
  chapters:
    - 00-overview: System map, artifact lineage, execution paths, and evidence standard.
    - 01-introduction: Next-token modeling, scope, baselines, and reproducibility contract.
    - 02-text-data: Token IDs, context-target windows, embeddings, and batches.
    - 03-attention: Scaled dot-product, causal masking, and multi-head attention.
    - 04-gpt-model: Decoder blocks, tensor shapes, and generation-ready model.
    - 05-pretraining: Loss, validation, generation, checkpoints, and weight loading.
    - 06-classification: Classification head, split discipline, fine-tuning, and metrics.
    - 07-instructions: Instruction formatting, supervised tuning, and response evaluation.
    - 08-lora: Optional low-rank adapters and trainable-parameter comparison.
    - 09-capstone: Reproduce and compare the model's major stages with documented limits.
actualized:
  summary: ''
