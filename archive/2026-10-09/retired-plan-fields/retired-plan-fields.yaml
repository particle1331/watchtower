- id: course/llms-from-scratch
  location: contract.planned
  values:
    summary: Start with the language-model task and an experiment contract, then prepare
      token sequences, derive causal multi-head attention, assemble GPT, and pretrain
      it. Branch into classification and instruction fine-tuning, study LoRA as an
      optional extension, and finish with a reproducible comparison of the stages.
- id: course/reasoning-from-scratch
  location: contract.planned
  values:
    summary: Start from a pretrained Qwen3 base model, establish a task and evaluation
      contract, then compare ordinary generation with test-time scaling and self-refinement.
      Continue with reward-driven fine-tuning using RL and GRPO, and finish by distilling
      reasoning behavior into a smaller, faster model. The notebooks follow the main
      progression of Sebastian Raschka's reasoning-from-scratch repository while making
      compute costs and limits explicit.
- id: course/text-classification-from-scratch
  location: contract.planned
  values:
    summary: Define the task and label contract; audit provenance; construct grouped
      splits; establish a TF-IDF baseline; trace the history from bag-of-words through
      neural and transformer classifiers; compare task-specific models, prompted LLMs,
      and structured general-purpose decision APIs; evaluate calibration, errors,
      task transfer, efficiency, and deployment; and finish by implementing and evaluating
      a Jev-like Choice/Noul/Score model with a shared ModernBERT candidate-scoring
      head.
