- id: post/flet-01-declarative-ui-and-layout
  kind: post
  title: 'Flet I: Basics'
  path: content/notebooks/posts/flet-01-declarative-ui-and-layout.ipynb
  visibility: private
  lifecycle: planned
  relations:
  - post/flet-02-components-and-state
  date: '2026-10-16'
  description: Build a small declarative Flet interface and understand controls, components,
    events and layout before adding application complexity.
  internal_notes: ''
  internal_todos: []
  attachments: []
  tags:
  - flet
  - python
  planned:
    introduction: A first Flet app can become a collection of control mutations copied
      from examples without a clear account of how Python, the UI runtime and rendered
      controls fit together. Establish a usable mental model and reproducible local
      setup first.
    content: 'Audience: Python programmers with no Flet experience. Introduce a standalone
      six-post Introduction to Flet series; each article explains one reusable topic
      with a small example that can run without Watchtower, Turso, B2 or paid services.
      Pin and record the Python/Flet/tooling versions when authoring, and explain
      local desktop versus Python-served browser execution without implying that deployment
      modes have identical capabilities. Build a small in-memory reading-list interface
      using the declarative entry point, controls and nested Row/Column/container
      layout. Explain properties, callbacks, spacing, scrolling and narrow-window
      behavior through that example. Show one small control-mutation counterexample
      to motivate describing UI from state, then leave detailed state ownership to
      Part 02. Include exact launch/stop instructions and a short runtime diagram.
      The notebook explains and records the example; starting a GUI must be an explicit
      action rather than a blocking cell automatically run during site rendering.
      References: [creating an app](https://flet.dev/docs/getting-started/create-flet-app/),
      [installation](https://flet.dev/docs/getting-started/installation/) and [declarative
      model](https://flet.dev/docs/cookbook/declarative-vs-imperative/).'
    evidence: Launch the pinned example in the recorded desktop and browser environments,
      explain the visible control tree, resize it and identify the callback-to-state-to-render
      path. Record the actual supported runtimes and any failure rather than claiming
      all-platform coverage. The reader changes one layout rule and predicts the result.
      Capture readable screenshots when the article is authored. Keep all state in
      memory and make no CMS/backend implementation claims. End with a short recap
      and a reference to Part 02 for state and composition.
- id: post/flet-02-components-and-state
  kind: post
  title: 'Introduction to Flet 02: Components and State'
  path: content/notebooks/posts/flet-02-components-and-state.ipynb
  visibility: private
  lifecycle: planned
  relations:
  - post/flet-01-declarative-ui-and-layout
  - post/flet-03-forms-and-dialogs
  date: '2026-10-16'
  description: Choose where UI state lives, compose declarative components and preserve
    the identity of editable list items.
  internal_notes: ''
  internal_todos: []
  attachments: []
  tags:
  - flet
  - python
  planned:
    introduction: A normal local variable can reset on a render, while shared mutable
      state can make independent editors interfere. The reader needs to distinguish
      component memory, shared view state and accepted application data before building
      larger screens.
    content: 'Recap Part 01 briefly and keep the example independently runnable. Use
      the small reading list to introduce component inputs and callbacks, component-local
      state, supported observable view models, shared context only where useful, and
      stable list-item identity. Start with a lost-edit or wrong-row example, identify
      its state/identity mistake, then correct it. Explain how an editor buffer differs
      from the accepted in-memory record, and how save/cancel changes each. Keep Flet
      decorators and hooks on presentation models; pure application/domain data should
      not become framework-dependent merely because the UI observes it. Introduce
      lifecycle/effects only enough to explain initialization and cleanup; detailed
      async work belongs in Part 04. Avoid a catalog of every hook. Reference: [Flet
      declarative components, observables and hooks](https://flet.dev/docs/cookbook/declarative-vs-imperative/).'
    evidence: Edit one row, trigger an unrelated render, reorder/remove another row
      and demonstrate that the edited buffer remains with the correct identity. Show
      independent component instances retaining independent state, then demonstrate
      explicit save and cancel. The reader identifies the owner and lifetime of each
      value and can reproduce the broken ordinary-variable example before fixing it.
      Record the limitations of any identity behavior not yet checked on the pinned
      runtime. No database, revision protocol or Watchtower2 architecture is implemented
      in this article.
- id: post/flet-03-forms-and-dialogs
  kind: post
  title: 'Introduction to Flet 03: Forms and Dialogs'
  path: content/notebooks/posts/flet-03-forms-and-dialogs.ipynb
  visibility: private
  lifecycle: planned
  relations:
  - post/flet-02-components-and-state
  - post/flet-04-async-work-and-services
  date: '2026-10-16'
  description: Design declarative forms and dialogs that preserve entered values,
    make validation clear and handle save, cancel and dismissal deliberately.
  internal_notes: ''
  internal_todos: []
  attachments: []
  tags:
  - flet
  - python
  planned:
    introduction: A form can look correct while losing entered text after validation,
      a dialog close or a failed save. Treating dialog visibility, editor buffers
      and accepted values as explicit states makes those behaviors understandable.
    content: 'Build a standalone reading-item editor with a text field, checklist
      and declarative dialog, recapping the state model from Part 02. Explain field
      values, local validation messages, dirty state, save/cancel, pending submission,
      dialog visibility and dismissal. Use an injectable in-memory save function to
      reject a submission and retain its fields; distinguish convenient UI validation
      from authoritative application validation without designing a database protocol.
      Cover keyboard activation, labels, focus restoration and close-with-unsaved-edits
      behavior. Define expected transitions before adding event handlers and keep
      those handlers small. References: [declarative dialogs](https://flet.dev/docs/cookbook/declarative-dialogs/)
      and [accessibility](https://flet.dev/docs/cookbook/accessibility/).'
    evidence: Demonstrate empty/invalid input, edit/cancel, successful save, a rejected
      save and dismissal with dirty fields. Verify that errors preserve input and
      that accepted data changes only on success. Record focus/keyboard observations
      on the chosen runtime; do not equate the presence of a label with demonstrated
      accessibility. The reader draws the form-state transitions and implements one
      additional validation rule. Distributed stale-write semantics and the Watchtower2
      card workflow remain application-course material.
- id: post/flet-04-async-work-and-services
  kind: post
  title: 'Introduction to Flet 04: Async Work and Services'
  path: content/notebooks/posts/flet-04-async-work-and-services.ipynb
  visibility: private
  lifecycle: planned
  relations:
  - post/flet-03-forms-and-dialogs
  - post/flet-05-navigation-and-lists
  date: '2026-10-16'
  description: Keep a Flet interface responsive while calling an application service
    and showing loading, success and failure states.
  internal_notes: ''
  internal_todos: []
  attachments: []
  tags:
  - flet
  - python
  planned:
    introduction: A slow callback can freeze interaction, a late result can replace
      newer data, and a render can accidentally trigger duplicate work. Readers need
      a small explicit model of asynchronous UI work before connecting real services.
    content: 'Use a standalone delayed reading-list lookup and fake save service with
      controlled success/failure. Explain the event loop, supported async callbacks,
      the difference between awaiting I/O and blocking work, and why async does not
      automatically make CPU-heavy work nonblocking. Separate declarative rendering
      from side effects and application calls. Model idle/loading/succeeded/failed
      states, progress where meaningful, duplicate-submit prevention, stale-result
      suppression and cleanup after navigating away or disposing a component. Distinguish
      stopping observation from cancelling a remote operation; state what cancellation
      the chosen API actually supports. Keep retry policy and durable work outside
      the component. No real network account, queue, Turso or B2 is required. Reference:
      [Flet async applications](https://flet.dev/docs/cookbook/async-apps/).'
    evidence: Interact with the UI while a delayed operation runs, force a service
      error, issue requests whose results arrive in reverse order and leave the screen
      before completion. Show the intended final state and the absence of duplicate
      saves. The reader traces one event through the service boundary and identifies
      which state is temporary. Record actual runtime behavior and limitations of
      cancellation. The main course later applies these techniques to Watchtower2
      revision conflicts, upload operations and durable jobs; this article explains
      the reusable UI mechanism.
- id: post/flet-05-navigation-and-lists
  kind: post
  title: 'Introduction to Flet 05: Navigation and Lists'
  path: content/notebooks/posts/flet-05-navigation-and-lists.ipynb
  visibility: private
  lifecycle: planned
  relations:
  - post/flet-04-async-work-and-services
  - post/flet-06-files-and-rich-content
  date: '2026-10-16'
  description: Build a small list/detail interface with explicit selection, routes,
    filters, return behavior and keyboard access.
  internal_notes: ''
  internal_todos: []
  attachments: []
  tags:
  - flet
  - python
  planned:
    introduction: Navigation and list refreshes can discard editor state, select the
      wrong item or make the Back action ambiguous. A useful interface needs a stable
      account of location, selection and temporary state.
    content: 'Build an independently runnable in-memory reading-list/detail example
      using the pinned declarative routing API. Define routes, route parameters and
      not-found handling; distinguish a route, a selected item, a filter and an unsaved
      editor buffer. Add search/filter and stable item identity, preserve the intended
      return location and explain refresh/back behavior in the actually exercised
      browser/desktop modes. Introduce list rendering/scrolling and when a measured
      long-list problem warrants a different control or paging; avoid unsupported
      performance claims. Include visible explicit actions, keyboard order and focus
      behavior. A compact state diagram should explain navigation and dirty-editor
      handling. References: [Router](https://flet.dev/docs/controls/router/) and [accessibility](https://flet.dev/docs/cookbook/accessibility/).'
    evidence: Open a supported detail URL, exercise Back/return, filter the list,
      remove or reorder a nonselected item and attempt navigation with unsaved edits.
      Show that selection and editor state follow the intended identity and lifetime.
      Distinguish observed deep-link/refresh behavior from assumptions about all deployment
      modes. The reader adds an empty/not-found state and explains what state survives
      navigation. Watchtower2-specific board columns, artifact lookup and course-outline
      rules belong in the application course.
- id: post/flet-06-files-and-rich-content
  kind: post
  title: 'Introduction to Flet 06: Files and Rich Content'
  path: content/notebooks/posts/flet-06-files-and-rich-content.ipynb
  visibility: private
  lifecycle: planned
  relations:
  - post/flet-05-navigation-and-lists
  date: '2026-10-16'
  description: Handle file selection, cancellation and progress, and display Markdown,
    math and images with explicit runtime assumptions.
  internal_notes: ''
  internal_todos: []
  attachments: []
  tags:
  - flet
  - python
  planned:
    introduction: Selecting a file does not mean a server owns its bytes, and a browser-selected
      filename is not a server filesystem path. Rich previews and file gestures also
      have platform-dependent behavior that a successful desktop demo cannot establish.
    content: 'Build a small standalone document/reading-item preview using explicit
      local fixtures and a fake upload receiver. Explain selection identity, filename,
      available bytes/path, cancellation, limits and upload progress separately. Use
      the documented browser client-action approach where required by user-gesture
      restrictions, and record the supported desktop/browser differences instead of
      relying on a single imperative callback pattern. Demonstrate Markdown, a representative
      math expression, code and image/error placeholders; describe the actual extension/rendering
      support of the pinned control. Treat link opening and untrusted content as deliberate
      application choices. Keep selected files while a dialog changes and clean only
      app-owned temporary staging. References: [FilePicker](https://flet.dev/docs/services/filepicker/),
      [PickFiles client action](https://flet.dev/docs/types/pickfiles/) and [Markdown](https://flet.dev/docs/controls/markdown/).'
    evidence: Exercise selection and cancel, two same-named selections, invalid type/size,
      rejected/failed fake upload and a missing preview image. Show which metadata
      and bytes are actually available in each exercised runtime and that selection
      alone does not establish durable ownership. Render the representative text/math
      fixture and record supported/unsupported syntax. The reader traces file selection
      through temporary UI state and an application call. B2 verification, ownership,
      private downloads, release assets and garbage collection remain Watchtower2
      backend concerns; this post does not implement them.
