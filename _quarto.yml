bibliography: assets/references.bib

execute:
  enabled: false

format:
  html:
    theme: united
    lightbox: true
    html-math-method: katex
    highlight-annotations: true
    toc: true
    toc-location: right
    css: assets/styles.css

project:
  type: website
  output-dir: _site
  render:
    - index.ipynb
    - portfolio/portfolio.ipynb
    - notes/index.ipynb
    - notes/*.ipynb
    - articles/index.ipynb
    - articles/*.ipynb
    - courses/index.ipynb
    - courses/**/*.ipynb
    - photos/photos.ipynb
  preview:
    port: 4200
    browser: false

website:
  title: "Ron Medina ∷ Résumé"
  back-to-top-navigation: true
  page-navigation: true
  bread-crumbs: true
  reader-mode: true
  favicon: assets/favicon.jpg

  navbar:
    left:
      - href: portfolio/portfolio.ipynb
        text: portfolio
      - href: articles/index.ipynb
        text: articles
      - href: notes/index.ipynb
        text: notes
      - href: courses/index.ipynb
        text: courses
      - href: photos/photos.ipynb
        text: photos

