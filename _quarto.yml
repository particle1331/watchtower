bibliography: assets/references.bib

execute:
  enabled: false

format:
  html:
    theme: united
    lightbox: true
    html-math-method: katex
    highlight-annotations: true
    toc: true
    toc-location: right
    css: assets/styles.css

project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - nb/portfolio/portfolio.ipynb
    - nb/notes/index.ipynb
    - nb/notes/*.ipynb
    - nb/articles/index.ipynb
    - nb/articles/*.ipynb
    - nb/courses/index.ipynb
    - nb/courses/**/*.ipynb
    - nb/photos/photos.ipynb
  preview:
    port: 4200
    browser: false

website:
  title: "Ron Medina ∷ Résumé"
  draft-mode: visible
  back-to-top-navigation: true
  page-navigation: true
  bread-crumbs: true
  reader-mode: true
  favicon: assets/favicon.jpg

  navbar:
    left:
      - href: nb/portfolio/portfolio.ipynb
        text: portfolio
      - href: nb/articles/index.ipynb
        text: articles
      - href: nb/notes/index.ipynb
        text: notes
      - href: nb/courses/index.ipynb
        text: courses
      - href: nb/photos/photos.ipynb
        text: photos
    right:
      - icon: github
        href: 
          https://github.com/particle1331/watchtower/tree/main/src/watchtower
        aria-label: watchtower source on GitHub

