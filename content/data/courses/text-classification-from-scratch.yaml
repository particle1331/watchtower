id: course/text-classification-from-scratch
purpose: Teach end-to-end text classification through an AI-written-text detection
  case study and the history of text-classification architectures, then apply the
  ideas in a multi-task Jev-like decision model implemented with a pretrained ModernBERT
  encoder.
audience: Python practitioners who know basic supervised learning and want to build,
  evaluate, and serve text classifiers; GPU training and external APIs are optional
  extensions.
planned:
  summary: Define the task and label contract; audit provenance; construct grouped
    splits; establish a TF-IDF baseline; trace the history from bag-of-words through
    neural and transformer classifiers; compare task-specific models, prompted LLMs,
    and structured general-purpose decision APIs; evaluate calibration, errors, task
    transfer, efficiency, and deployment; and finish by implementing and evaluating
    a Jev-like Choice/Noul/Score model with a shared ModernBERT candidate-scoring
    head.
  chapters: []
actualized:
  summary: Authored the course home, system overview, and ten chapters. Augmented
    the model-family, evaluation, efficiency, deployment, and capstone chapters with
    classifier history, structured decision APIs, calibration, and cross-task generalization.
    The capstone now specifies a multi-task ModernBERT implementation of a Jev-like
    decision interface, including held-out task transfer and probability calibration.
    Added exercises and rendered the affected notebooks to HTML for syntax checks.
