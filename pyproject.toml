[project]
name = "watchtower"
version = "0.1.0"
description = "A central workspace for personal learning and portfolio projects."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.0",
    "rich>=14.1.0",
    "keyring>=25.6.0",
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1.0",
    "jupytext>=1.16.0",
    "nbformat>=5.10.0",
    "nbclient>=0.11.0",
    "matplotlib>=3.11.0",
    "ipython>=9.15.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab-quarto>=0.3.5",
    "openai>=3.0.0",
    "agent-harness",
    "autocode",
    "change-planner",
    "proof-lm",
]

[project.scripts]
watchtower = "watchtower.cli:main"
wt = "watchtower.cli:main"

[tool.uv.workspace]
members = ["projects/*"]

[tool.uv.sources]
agent-harness = { workspace = true }
autocode = { workspace = true }
change-planner = { workspace = true }
proof-lm = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390.0",
]
ml = [
    "datasets>=5.0.1",
    "networkx>=3.4",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.15.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchtower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src", "projects"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
