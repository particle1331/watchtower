{% for field in fields %}
{% if field.label not in ['id', 'kind', 'version'] and not (artifact is defined and artifact.kind == 'gallery' and field.label == 'lifecycle') %}
<label class="field"><span>{{ field.label | replace('_',' ') }}</span>
{% if field.type == 'photo_lifecycle' %}<select name="field:{{ field.name }}">{% for state in ['draft','published'] %}<option {% if field.value == state %}selected{% endif %}>{{ state }}</option>{% endfor %}</select>
{% elif field.type == 'bool' %}<select name="field:{{ field.name }}"><option value="true" {% if field.value %}selected{% endif %}>Yes</option><option value="false" {% if not field.value %}selected{% endif %}>No</option></select>
{% elif field.label == 'visibility' %}<select name="field:{{ field.name }}"><option {% if field.value == 'public' %}selected{% endif %}>public</option><option {% if field.value == 'private' %}selected{% endif %}>private</option></select>
{% elif field.label == 'lifecycle' %}<select name="field:{{ field.name }}">{% for state in ['planned','draft','published'] %}<option {% if field.value == state %}selected{% endif %}>{{ state }}</option>{% endfor %}</select>
{% elif field.type == 'lines' or field.value | string | length > 100 or field.label.endswith('content') or 'planned' in field.label or field.label.endswith('summary') or field.label.endswith('caption') or field.label.endswith('lab_and_evidence') %}<textarea rows="{{ 5 if field.type != 'lines' else 3 }}" name="field:{{ field.name }}">{{ field.value }}</textarea>{% if field.type == 'lines' %}<small>One value per line; order is preserved.</small>{% endif %}
{% else %}<input type="{{ 'number' if field.type in ['int','float'] else 'text' }}" {% if field.type == 'float' %}step="any"{% endif %} name="field:{{ field.name }}" value="{{ field.value }}">{% endif %}</label>
{% endif %}{% endfor %}
