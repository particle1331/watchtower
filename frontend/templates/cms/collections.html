{% for collection in collections %}<details class="collection-add"><summary>Add to {{ collection.label | replace('_',' ') }}</summary>{% if collection.prototype %}<p>Enter the new record below. Adding it also saves the other fields in this form.</p>{% for field in collection.fields %}<label>{{ 'Photo' if field.type == 'photo_image' else field.label.split(' / ')[-1] | replace('_',' ') | capitalize }}{% if field.type == 'photo_image' %}<input type="hidden" name="new:{{ field.name }}" value="{{ field.value }}"><input type="file" name="new_photo_image" accept="image/png,image/jpeg,image/webp,image/gif"><small>PNG, JPEG, WebP, or GIF, up to 20 MB. Saved when you add the row.</small>{% elif field.type == 'photo_lifecycle' %}<select name="new:{{ field.name }}">{% for state in ['draft','published'] %}<option {% if field.value == state %}selected{% endif %}>{{ state }}</option>{% endfor %}</select>{% elif field.type == 'photo_width' %}<input name="new:{{ field.name }}" value="{{ field.value }}" placeholder="80%"><small>Image width as a percentage of the content column (up to 100%). Leave blank for default size.</small>{% elif field.type == 'lines' %}<textarea name="new:{{ field.name }}" rows="3">{{ field.value }}</textarea><small>One value per line</small>{% else %}<input name="new:{{ field.name }}" value="{{ field.value }}">{% endif %}</label>{% endfor %}<button name="collection_action" value='{{ {"path": collection.path, "action": "add", "prototype": collection.prototype} | tojson }}'>Add row and save</button>{% endif %}</details>{% endfor %}
